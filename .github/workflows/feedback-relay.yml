name: Deploy feedback relay

# 部署应用内「反馈」用的中转站（feedback-relay/）到 Cloudflare Workers。
# 需要主仓库里有三个 Actions 密钥：
#   CLOUDFLARE_API_TOKEN   Cloudflare「Edit Cloudflare Workers」模板生成的令牌
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账户 ID
#   FEEDBACK_GITHUB_TOKEN  只对私有仓库 XL_Translator-feedback 有 Issues 读写权限的细粒度令牌
# 缺任何一个就跳过部署（不报红），所以合进 main 时不会因为还没配好而让检查失败。
# 第一次部署时自动建 KV 命名空间和下载链接签名用的 LINK_SECRET；之后重复部署保持不变，
# 以前发出的下载链接继续有效。

on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "部署后真实发一条测试反馈，确认私有仓库收到并能下载附件，然后关闭这条 issue"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - feedback-relay/**
      - .github/workflows/feedback-relay.yml

permissions:
  contents: read

concurrency:
  group: feedback-relay
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.136.1
  WORKER_NAME: xl-translator-feedback
  KV_TITLE: xl-translator-feedback

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
    steps:
      - name: Check that the secrets are configured
        id: gate
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$FEEDBACK_GITHUB_TOKEN" ] || missing="$missing FEEDBACK_GITHUB_TOKEN"
          if [ -n "$missing" ]; then
            echo "::notice::Feedback relay not deployed: missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6.0.3
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: "24"

      - name: Relay behaviour tests
        if: steps.gate.outputs.ready == 'true'
        run: node tests/feedback_relay.test.mjs

      - name: Find or create the KV namespace
        if: steps.gate.outputs.ready == 'true'
        id: kv
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          id=$(curl -fsS "${auth[@]}" "$api?per_page=100" | jq -r --arg t "$KV_TITLE" '.result[] | select(.title == $t) | .id' | head -n 1)
          if [ -z "$id" ]; then
            id=$(curl -fsS "${auth[@]}" -H "Content-Type: application/json" -X POST "$api" \
              --data "$(jq -n --arg t "$KV_TITLE" '{title: $t}')" | jq -r '.result.id')
            echo "Created KV namespace $id"
          fi
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::Could not find or create the KV namespace"; exit 1; }
          sed -i "s/__FEEDBACK_KV_ID__/$id/" feedback-relay/wrangler.toml

      - name: Prepare secrets
        if: steps.gate.outputs.ready == 'true'
        working-directory: feedback-relay
        run: |
          umask 077
          # LINK_SECRET 一旦生成就不能换，否则已发出的下载链接全部失效：查不清楚就停下。
          code=$(curl -sS -o "$RUNNER_TEMP/secrets-list.json" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets")
          if [ "$code" = "200" ]; then
            has_link=$(jq -r '[.result[].name] | index("LINK_SECRET") != null' "$RUNNER_TEMP/secrets-list.json")
          elif [ "$code" = "404" ]; then
            has_link=false
          else
            echo "::error::Could not list the relay's secrets (HTTP $code)"
            exit 1
          fi
          if [ "$has_link" = "true" ]; then
            jq -n --arg gh "$FEEDBACK_GITHUB_TOKEN" '{GITHUB_TOKEN: $gh}' > "$RUNNER_TEMP/secrets.json"
          else
            echo "Generating LINK_SECRET for the first deployment"
            jq -n --arg gh "$FEEDBACK_GITHUB_TOKEN" --arg link "$(openssl rand -hex 32)" \
              '{GITHUB_TOKEN: $gh, LINK_SECRET: $link}' > "$RUNNER_TEMP/secrets.json"
          fi

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        working-directory: feedback-relay
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --secrets-file "$RUNNER_TEMP/secrets.json"

      - name: Check the deployed relay
        if: steps.gate.outputs.ready == 'true'
        id: live
        run: |
          rm -f "$RUNNER_TEMP/secrets.json"
          subdomain=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          url="https://$WORKER_NAME.$subdomain.workers.dev"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url/health"; then
              echo
              echo "### Feedback relay is live" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "\`$url\`" >> "$GITHUB_STEP_SUMMARY"
              echo "Relay URL: $url"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deployed, but $url/health did not answer"
          exit 1

      # 手动运行时可选：像应用一样发一条带附件的测试反馈，再用反馈仓库的令牌找到这条 issue、
      # 下载附件比对，最后留言并关闭它。只验证整条链路，不留下未处理的 issue。
      - name: End-to-end test
        if: steps.gate.outputs.ready == 'true' && inputs.smoke_test
        env:
          RELAY_URL: ${{ steps.live.outputs.url }}
        run: |
          set -euo pipefail
          repo=$(sed -n 's/^FEEDBACK_REPO *= *"\(.*\)"/\1/p' feedback-relay/wrangler.toml)
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work"
          python3 - "$work/package.zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1], "w") as z:
              z.writestr("feedback.json", '{"smoke_test": true}')
              z.writestr("log.txt", "deploy smoke test")
          PY
          meta=$(jq -n '{category: "other", description: "部署后的连通测试（自动发出，会自动关闭）", contact: "", app_version: "smoke-test", platform: "GitHub Actions", ui_language: "zh", includes: {system: false, task_logs: 0, files: [], images: 0}}')
          response=$(curl -fsS --form-string "meta=$meta" -F "package=@$work/package.zip;type=application/zip" "$RELAY_URL/v1/feedback")
          id=$(echo "$response" | jq -r '.id')
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::Relay did not return a feedback id: $response"; exit 1; }
          echo "Feedback id: $id"
          gh_api() { curl -fsS -H "Authorization: Bearer $FEEDBACK_GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          issue=""
          for attempt in 1 2 3 4 5; do
            issue=$(gh_api "https://api.github.com/repos/$repo/issues?state=open&per_page=20" | jq -c --arg id "$id" '[.[] | select(.title | contains($id))][0] // empty')
            [ -n "$issue" ] && break
            sleep 5
          done
          [ -n "$issue" ] || { echo "::error::No issue for $id in $repo"; exit 1; }
          number=$(echo "$issue" | jq -r '.number')
          link=$(echo "$issue" | jq -r '.body' | grep -o "$RELAY_URL/v1/files/[^)]*" | head -n 1)
          curl -fsS -o "$work/downloaded.zip" "$link"
          cmp "$work/package.zip" "$work/downloaded.zip"
          gh_api -X POST "https://api.github.com/repos/$repo/issues/$number/comments" \
            --data "$(jq -n '{body: "部署后的自动连通测试：提交、开 issue、下载附件均正常。自动关闭。"}')" > /dev/null
          gh_api -X PATCH "https://api.github.com/repos/$repo/issues/$number" \
            --data '{"state": "closed", "state_reason": "completed"}' > /dev/null
          {
            echo ""
            echo "### End-to-end test passed"
            echo ""
            echo "Feedback $id became issue #$number in $repo; the attachment downloaded intact. The issue was closed."
          } >> "$GITHUB_STEP_SUMMARY"
