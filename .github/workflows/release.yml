name: Release (tag / publish)

# 发版里所有要写 GitHub 的步骤都在这里，由 GitHub 自己的机器执行。
# 云端会话推不了 tag、也改不了 Release，以前只能等 maple 的 Mac 在线代办；
# 现在云端 Claude 用 workflow_dispatch 触发本工作流即可，maple 也可以在
# GitHub 网页 Actions 页手动点 Run workflow。
#
# 分开触发，打标签、发布、撤回每一步都要 maple 先在对话里确认：
#
#   step=tag      在 main 最新提交上打 v{version} 标签，并触发
#                 build-distributions.yml 出草稿 Release。
#   step=publish  用仓库里的 docs/release-notes/v{version}.md 替换草稿正文，
#                 读回核对一致后再取消草稿（AGENTS.md 第 9 条的顺序），
#                 最后确认 releases/latest 和 latest.json 都指向新版本。
#                 撤回过的版本改好后也用它重新发布。
#   step=notes    只换正文（草稿或已发布都可以），核对规则同 publish，
#                 不改变草稿状态。用于发布后修订说明。
#   step=retract  把已发布的版本改回草稿：不删产物、不动标签。改完确认
#                 releases/latest 和 latest.json 都已回到上一个正式版，
#                 已安装的应用不会再收到这个版本的更新。
#   step=discard  删掉一个还没发布（草稿）的版本，以便用同一版本号重新构建：
#                 先确认原来的提交留得住：建 archive/v{version}-{短提交号}
#                 标签指向它；工作流的令牌建不了时（该提交改过工作流文件，
#                 GITHUB_TOKEN 没有 workflows 权限），确认它已在 main 的历史里
#                 也算留住。然后删草稿 Release 和 v{version} 标签。已发布的
#                 版本拒绝删除，要先 retract。
#
# 用 GITHUB_TOKEN 创建的 tag 不会触发 push 事件（GitHub 防止工作流互相
# 连锁触发），所以 tag 步骤显式 dispatch 构建工作流，并传 release=true 让它
# 走和 tag push 完全相同的正式发布路径。

on:
  workflow_dispatch:
    inputs:
      step:
        description: "tag = 打标签并开始构建；publish = 换正文并正式发布；notes = 只换正文；retract = 撤回为草稿；discard = 删除草稿和标签（先留归档标签）"
        required: true
        type: choice
        options:
          - tag
          - publish
          - notes
          - retract
          - discard
      version:
        description: "版本号，例如 10.0.1（不带 v）"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  VERSION: ${{ inputs.version }}

jobs:
  tag:
    name: Tag v${{ inputs.version }} and start the build
    if: inputs.step == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Only from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::只能从 main 打发布标签（本次是 $GITHUB_REF）。"
            exit 1
          fi
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - name: Check version, changelog and that the tag is new
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          python scripts/verify_release_metadata.py --tag "$tag"
          python scripts/check_changelog_version.py --version "$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::标签 $tag 已经存在，不会覆盖。"
            exit 1
          fi
      # PR checks 在构建机同款的 Python 3.11 + 锁定依赖、没有 Office 的 Linux 上
      # 跑全量测试，等价于 AGENTS.md 第 8 条在云端的那一半；macOS 构建里还会
      # 再跑一遍 release_env_tests.py。
      - name: Require green PR checks on this commit
        shell: bash
        run: |
          set -euo pipefail
          green="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pr-checks.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')"
          if [[ "$green" == "0" ]]; then
            echo "::error::main 的 $GITHUB_SHA 上还没有通过的 PR checks，等它变绿再打标签。"
            exit 1
          fi
      - name: Create the tag
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v${VERSION}" \
            -f sha="$GITHUB_SHA" >/dev/null
          echo "已在 $GITHUB_SHA 上创建标签 v${VERSION}。"
      - name: Start the release build
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run build-distributions.yml --ref "v${VERSION}" -f release=true
          {
            echo "### v${VERSION}"
            echo
            echo "- 标签：\`v${VERSION}\` → \`$GITHUB_SHA\`"
            echo "- 已触发 Build Translator distributions，完成后会生成**草稿** Release。"
            echo "- 下一步：把发布说明写进 \`docs/release-notes/v${VERSION}.md\` 合进 main，再用 step=publish 运行本工作流。"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: ${{ inputs.step == 'notes' && 'Update notes of' || 'Publish' }} v${{ inputs.version }}
    if: inputs.step == 'publish' || inputs.step == 'notes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - name: Read the release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::版本号格式应为 X.Y.Z（不带 v），收到的是 $VERSION。"
            exit 1
          fi
          tag="v${VERSION}"
          if ! gh release view "$tag" --json isDraft,body,assets > "$RUNNER_TEMP/release.json"; then
            echo "::error::找不到 $tag 的 Release。构建可能还没跑完，或者标签没打。"
            exit 1
          fi
          if [[ "$STEP" == "publish" && "$(jq -r '.isDraft' "$RUNNER_TEMP/release.json")" != "true" ]]; then
            echo "::error::$tag 已经发布，不是草稿。只改正文请用 step=notes。"
            exit 1
          fi
          jq -r '.body' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/current-body.md"
          jq -r '.assets[].name' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/assets.txt"
          cat "$RUNNER_TEMP/assets.txt"
        env:
          STEP: ${{ inputs.step }}
      - name: Check the release notes against this build
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/release-notes/v${VERSION}.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::main 上没有 $notes。先把发布说明合进 main。"
            exit 1
          fi
          python scripts/check_release_notes.py \
            --notes "$notes" \
            --version "$VERSION" \
            --assets "$RUNNER_TEMP/assets.txt" \
            --draft-body "$RUNNER_TEMP/current-body.md"
      # 顺序不能换：先替换正文、读回核对，最后才取消草稿。
      - name: Replace the body and read it back
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          notes="docs/release-notes/v${VERSION}.md"
          gh release edit "$tag" --notes-file "$notes" >/dev/null
          gh release view "$tag" --json body --jq '.body' > "$RUNNER_TEMP/readback.md"
          python scripts/check_release_notes.py --notes "$notes" --compare "$RUNNER_TEMP/readback.md"
          if [[ "$STEP" == "notes" ]]; then
            echo "### v${VERSION} 的正文已更新，草稿状态未变" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          STEP: ${{ inputs.step }}
      - name: Publish
        if: inputs.step == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          gh release edit "$tag" --draft=false >/dev/null
          gh release view "$tag" --json isDraft,url,assets > "$RUNNER_TEMP/published.json"
          if [[ "$(jq -r '.isDraft' "$RUNNER_TEMP/published.json")" != "false" ]]; then
            echo "::error::取消草稿后读回仍是草稿。"
            exit 1
          fi
          url="$(jq -r '.url' "$RUNNER_TEMP/published.json")"
          {
            echo "### v${VERSION} 已发布"
            echo
            echo "$url"
            echo
            jq -r '.assets[] | "- \(.name)"' "$RUNNER_TEMP/published.json"
          } >> "$GITHUB_STEP_SUMMARY"
      # 已安装的应用从这两处得知新版本。临时签名包不带 latest.json，只核对前者。
      - name: Confirm installed apps now see this version
        if: inputs.step == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if ! grep -qx 'latest.json' "$RUNNER_TEMP/assets.txt"; then
            flags+=(--no-manifest)
          fi
          python scripts/check_release_latest.py --expect "v${VERSION}" "${flags[@]}"

  retract:
    name: Retract v${{ inputs.version }} to draft
    if: inputs.step == 'retract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - name: Turn the release back into a draft
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::版本号格式应为 X.Y.Z（不带 v），收到的是 $VERSION。"
            exit 1
          fi
          tag="v${VERSION}"
          if ! gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release.json"; then
            echo "::error::找不到 $tag 的 Release。"
            exit 1
          fi
          if [[ "$(jq -r '.isDraft' "$RUNNER_TEMP/release.json")" == "true" ]]; then
            echo "$tag 已经是草稿，不再改动，只核对对外的最新版。"
          else
            # 只改草稿状态：产物、标签、正文都保留，改好后用 step=publish 原样重新发布。
            gh release edit "$tag" --draft=true >/dev/null
          fi
          if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" != "true" ]]; then
            echo "::error::改回草稿后读回仍不是草稿。"
            exit 1
          fi
      - name: Confirm installed apps no longer see this version
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_release_latest.py --not "v${VERSION}"
          {
            echo "### v${VERSION} 已撤回为草稿"
            echo
            echo "产物和标签都保留。releases/latest 与 latest.json 已回到上一个正式版。"
            echo "修好后：如需改正文，更新 \`docs/release-notes/v${VERSION}.md\` 合进 main，再用 step=publish 重新发布。"
          } >> "$GITHUB_STEP_SUMMARY"

  discard:
    name: Discard draft v${{ inputs.version }} (keep an archive tag)
    if: inputs.step == 'discard'
    runs-on: ubuntu-latest
    steps:
      - name: Archive the tagged commit, then delete the draft and the tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::版本号格式应为 X.Y.Z（不带 v），收到的是 $VERSION。"
            exit 1
          fi
          tag="v${VERSION}"
          repo="$GITHUB_REPOSITORY"
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            if [[ "$(jq -r '.isDraft' "$RUNNER_TEMP/release.json")" != "true" ]]; then
              echo "::error::$tag 已经发布，不能直接删除。先用 step=retract 撤回为草稿。"
              exit 1
            fi
            has_release=1
          else
            has_release=0
          fi
          if ! gh api "repos/$repo/git/ref/tags/$tag" > "$RUNNER_TEMP/ref.json" 2>/dev/null; then
            echo "::error::找不到标签 $tag。"
            exit 1
          fi
          # 轻量标签直接指向提交；附注标签要再解一层。
          sha="$(jq -r '.object.sha' "$RUNNER_TEMP/ref.json")"
          if [[ "$(jq -r '.object.type' "$RUNNER_TEMP/ref.json")" == "tag" ]]; then
            sha="$(gh api "repos/$repo/git/tags/$sha" --jq '.object.sha')"
          fi
          archive="archive/${tag}-${sha:0:7}"
          kept=""
          if gh api "repos/$repo/git/ref/tags/$archive" >/dev/null 2>&1; then
            echo "归档标签 $archive 已存在。"
          elif ! gh api "repos/$repo/git/refs" -f "ref=refs/tags/$archive" -f "sha=$sha" >/dev/null 2> "$RUNNER_TEMP/archive.err"; then
            echo "::warning::建不了归档标签 $archive：$(cat "$RUNNER_TEMP/archive.err")"
          fi
          if [[ "$(gh api "repos/$repo/git/ref/tags/$archive" --jq '.object.sha' 2>/dev/null || true)" == "$sha" ]]; then
            kept="归档标签 \`$archive\`"
          else
            # 提交已在 main 的历史里（main 比它新或与它相同），删标签后也一直找得到。
            status="$(gh api "repos/$repo/compare/${sha}...main" --jq '.status')"
            if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
              echo "::error::$sha 既没有归档标签，也不在 main 的历史里（compare 结果 $status），停止，不删除任何东西。"
              exit 1
            fi
            kept="main 的历史（没有建成归档标签）"
          fi
          if [[ "$has_release" == "1" ]] && ! gh release delete "$tag" --yes; then
            echo "::error::删除草稿 Release $tag 失败，标签没有动。"
            exit 1
          fi
          if ! gh api -X DELETE "repos/$repo/git/refs/tags/$tag" 2> "$RUNNER_TEMP/delete.err"; then
            echo "::error::删除标签 $tag 失败：$(cat "$RUNNER_TEMP/delete.err")"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::删除后仍能读到 $tag 的 Release。"
            exit 1
          fi
          if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::删除后标签 $tag 仍然存在。"
            exit 1
          fi
          {
            echo "### 已删除草稿 $tag"
            echo
            echo "原提交 \`$sha\` 保留在$kept。"
            echo "现在可以用 step=tag 以同一版本号重新打标签和构建。"
          } >> "$GITHUB_STEP_SUMMARY"
