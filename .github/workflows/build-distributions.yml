name: Build Translator distributions

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate release eligibility
    runs-on: ubuntu-latest
    env:
      # Secret 名与 lantern 仓库保持一致：证书走 .p12（base64），公证走
      # Apple ID + App 专用密码 + Team ID，同一套值可在两个仓库直接复用。
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    outputs:
      formal_release: ${{ steps.classify.outputs.formal_release }}
      artifact_channel: ${{ steps.classify.outputs.artifact_channel }}
      temporary_signing: ${{ steps.classify.outputs.temporary_signing }}
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - id: classify
        name: Accept only stable version tags
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Only stable vX.Y.Z tags can create a formal release; got $GITHUB_REF_NAME." >&2
              exit 1
            fi
            if [[ -n "$APPLE_CERTIFICATE" \
              && -n "$APPLE_CERTIFICATE_PASSWORD" \
              && -n "$APPLE_ID" \
              && -n "$APPLE_PASSWORD" \
              && -n "$APPLE_TEAM_ID" ]]; then
              echo "formal_release=1" >> "$GITHUB_OUTPUT"
              echo "artifact_channel=formal-release" >> "$GITHUB_OUTPUT"
              echo "temporary_signing=0" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Apple signing/notarization secrets are unavailable; publishing a normal release whose assets are ad-hoc signed and not notarized."
              echo "formal_release=0" >> "$GITHUB_OUTPUT"
              echo "artifact_channel=temporary-test" >> "$GITHUB_OUTPUT"
              echo "temporary_signing=1" >> "$GITHUB_OUTPUT"
            fi
          else
            # A manual run is intentionally an unsigned test artifact.  It
            # never reaches the release job, even when dispatched from a tag.
            echo "formal_release=0" >> "$GITHUB_OUTPUT"
            echo "artifact_channel=unsigned-test" >> "$GITHUB_OUTPUT"
            echo "temporary_signing=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify version alignment
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python scripts/verify_release_metadata.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/verify_release_metadata.py
          fi

  macos:
    name: macOS ${{ matrix.architecture }} native DMG
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only: the runner is native, not cross-compiled or
          # a Rosetta build. Intel (x86_64) DMGs are no longer distributed.
          - architecture: arm64
            runner: macos-14
    env:
      MACOS_ARCH: ${{ matrix.architecture }}
      MACOS_MINIMUM_SYSTEM_VERSION: "12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      XL_TRANSLATOR_FORMAL_RELEASE: ${{ needs.validate-release.outputs.formal_release }}
      XL_TRANSLATOR_TEMPORARY_SIGNING: ${{ needs.validate-release.outputs.temporary_signing }}
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Confirm the runner is the requested native architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "$MACOS_ARCH"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            constraints-release-py311.txt
      - name: Create the controlled Python 3.11 release environment
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m venv .venv
          ./.venv/bin/python3 --version
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure Developer ID and notarization for an official tag
        if: needs.validate-release.outputs.formal_release == '1'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?Missing Developer ID certificate secret}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing Developer ID certificate password secret}"
          : "${APPLE_ID:?Missing Apple ID secret}"
          : "${APPLE_PASSWORD:?Missing Apple app-specific password secret}"
          : "${APPLE_TEAM_ID:?Missing Apple Team ID secret}"

          # 临时钥匙串密码只在本 run 内有效，随机生成即可，不必占一个 secret。
          keychain_password="$(uuidgen)"
          keychain="$RUNNER_TEMP/translator-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity"
          profile="translator-notary-${GITHUB_RUN_ID}-${MACOS_ARCH}"
          xcrun notarytool store-credentials "$profile" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          {
            echo "XL_TRANSLATOR_MACOS_CODESIGN_IDENTITY=$identity"
            echo "XL_TRANSLATOR_MACOS_NOTARY_PROFILE=$profile"
          } >> "$GITHUB_ENV"
      - name: Install macOS release dependencies
        run: |
          PYTHON_BIN=./.venv/bin/python3 bash ./scripts/install_macos_dependencies.sh
          npm ci --prefix ui
      - name: Run quality and macOS platform checks
        env:
          TRANSLATOR_APP_DATA_DIR: ${{ runner.temp }}/translator-tests/app-data
        run: |
          pwsh ./quality_gate.ps1
          ./.venv/bin/python3 -m unittest discover -s tests
          npm run check --prefix ui
          npm run build --prefix ui
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build, scan, sign, notarize, and verify the macOS DMG
        run: |
          PYTHON_BIN=./.venv/bin/python3 bash ./scripts/build_macos_package.sh
      # Stage into one directory first: uploading dist/ and .runtime/ paths
      # together makes the repo root the common ancestor, so the artifact keeps
      # a dist/ prefix and the release job cannot find the DMGs.
      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload
          cp "$MACOS_DMG" "$MACOS_DMG_SHA256" "$MACOS_RELEASE_REPORT" release-upload/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Translator_macOS_${{ matrix.architecture }}_${{ needs.validate-release.outputs.artifact_channel }}
          path: release-upload

  windows:
    name: Windows x64 NSIS installer
    needs: validate-release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Confirm the runner is x64
        shell: bash
        run: |
          set -euo pipefail
          test "$PROCESSOR_ARCHITECTURE" = "AMD64"
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            constraints-release-py311.txt
      - name: Create the controlled Python 3.11 release environment
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m venv .venv
          ./.venv/Scripts/python.exe --version
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install Windows release dependencies
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN=./.venv/Scripts/python.exe
          "$PYTHON_BIN" -m pip install --upgrade --constraint constraints-release-py311.txt pip
          "$PYTHON_BIN" -m pip install --constraint constraints-release-py311.txt --requirement requirements-build.txt
          # The verifier checks every locked release dependency, including
          # transitive packages that modern pip may omit when they are
          # optional on a platform.
          "$PYTHON_BIN" -m pip install --requirement constraints-release-py311.txt
          "$PYTHON_BIN" scripts/verify_release_dependencies.py --constraints constraints-release-py311.txt
          npm ci --prefix ui
      - name: Build the sidecar and package the NSIS installer
        shell: bash
        run: |
          set -euo pipefail
          ./.venv/Scripts/python.exe scripts/build_tauri_package.py \
            --platform windows \
            --python ./.venv/Scripts/python.exe
      # Stage into one directory first: uploading dist/ paths directly makes
      # the repo root the common ancestor, so the artifact would keep a
      # dist/ prefix and the release job could not find the installer.
      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload
          cp "$WINDOWS_INSTALLER" "$WINDOWS_INSTALLER_SHA256" release-upload/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: Translator_Windows_x64_${{ needs.validate-release.outputs.artifact_channel }}
          path: release-upload

  release:
    name: Publish release
    if: needs.validate-release.outputs.formal_release == '1' || needs.validate-release.outputs.temporary_signing == '1'
    needs:
      - validate-release
      - macos
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.0
        with:
          pattern: Translator_*_${{ needs.validate-release.outputs.artifact_channel }}
          path: release-assets
          merge-multiple: true
      - name: Verify exactly one complete native DMG and one Windows installer
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          channel="${{ needs.validate-release.outputs.artifact_channel }}"
          if [[ "$channel" == "formal-release" ]]; then
            expected=(
              "Translator_macOS_arm64_${version}.dmg"
              "Translator_macOS_arm64_${version}.dmg.sha256"
            )
          elif [[ "$channel" == "temporary-test" ]]; then
            expected=(
              "Translator_macOS_arm64_${version}_TEMP_SIGNED_TEST.dmg"
              "Translator_macOS_arm64_${version}_TEMP_SIGNED_TEST.dmg.sha256"
            )
          else
            echo "Unsupported release channel: $channel" >&2
            exit 1
          fi
          # The Windows installer has no signing-state variant: it is never
          # ad-hoc signed or notarized, so its name does not change by channel.
          expected+=(
            "Translator_Windows_x64_${version}_Setup.exe"
            "Translator_Windows_x64_${version}_Setup.exe.sha256"
          )
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset"
          done
          test "$(find release-assets -maxdepth 1 -name '*.dmg' -type f | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.dmg.sha256' -type f | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.exe' -type f | wc -l | tr -d ' ')" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.exe.sha256' -type f | wc -l | tr -d ' ')" -eq 1
          (
            cd release-assets
            shasum -a 256 -c "${expected[1]}"
            shasum -a 256 -c "${expected[3]}"
          )
      - uses: softprops/action-gh-release@v3.0.0
        with:
          # 工作流只产出草稿。草稿对外不可见、不占 Latest、不发通知，所以
          # 「说明还没写」这个中间状态永远不会被用户看到；写完说明的人执行
          # `gh release edit <tag> --draft=false` 才算发布。以前这里是直接
          # 发布加一句占位正文，于是每一版都有一段时间挂着「整理中」的公开
          # Release——万一写说明的人中途断了，那句占位就永久留在那儿了。
          draft: true
          # 每个 vX.Y.Z tag 都是正式发布：没有 Apple 密钥时仍然照常发布，
          # 只是在说明里讲清楚这次的安装包是 ad-hoc 签名、未公证。
          prerelease: false
          name: Translator ${{ github.ref_name }}
          # 正文只放一句占位，由人手工写成面向普通用户的说明后再取消草稿。
          # 这里刻意不去拼 changelog：changelog 是写给开发者看的，直接搬上来
          # 就是一堆术语，普通用户看不懂。占位句必须一眼看得出没写完——
          # 之前这里是一段讲渠道和签名的固定模板，看起来像正文，于是每一版
          # 的说明都长一个样，还出现过说明写着已签名、实物其实没签的情况。
          # 保留渠道一行，是为了事后写说明时能查到这次到底签没签、公证没公证。
          body: |
            ⚠️ 发布说明整理中，稍后补上。Release notes are being written.

            构建渠道 / Channel: `${{ needs.validate-release.outputs.artifact_channel }}`
            （`formal-release` = Developer ID 签名并通过 Apple 公证；`temporary-test` = ad-hoc 签名、未公证）
          files: |
            release-assets/*.dmg
            release-assets/*.dmg.sha256
            release-assets/*.exe
            release-assets/*.exe.sha256
