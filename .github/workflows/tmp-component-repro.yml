name: TEMP frozen sidecar check

on:
  push:
    branches:
      - claude/project-thread-ytjpby

permissions:
  contents: read
  actions: read

jobs:
  frozen:
    name: test build sidecar (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      matrix:
        scenario: [vc-runtime-hidden, socks-proxy-registry, chinese-data-dir]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8.0.0
        with:
          name: Translator_Windows_x64_unsigned-test
          run-id: 39625418224
          github-token: ${{ github.token }}
          path: build
      - name: Unpack the test installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem build -Recurse -Filter *_Setup.exe | Select-Object -First 1
          $setup.FullName
          7z x -y -orel $setup.FullName | Out-Null
      - name: Hide the VC++ runtime from System32
        if: matrix.scenario == 'vc-runtime-hidden'
        shell: pwsh
        run: |
          foreach ($item in Get-ChildItem C:\Windows\System32\msvcp140*.dll, C:\Windows\System32\vcruntime140*.dll, C:\Windows\System32\concrt140.dll -ErrorAction SilentlyContinue) {
            takeown /f $item.FullName | Out-Null
            icacls $item.FullName /grant "Administrators:F" | Out-Null
            Rename-Item $item.FullName "$($item.Name).hidden"
          }
      - name: SOCKS proxy in Internet Settings
        if: matrix.scenario == 'socks-proxy-registry'
        shell: pwsh
        run: |
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings"
          Set-ItemProperty $key ProxyEnable 1
          Set-ItemProperty $key ProxyServer "socks=127.0.0.1:7891"
      - name: One-click install through the test build's sidecar
        shell: pwsh
        timeout-minutes: 15
        run: |
          if ("${{ matrix.scenario }}" -eq "chinese-data-dir") { $env:REPRO_DATA_PARENT = "$env:RUNNER_TEMP\用户 张三" }
          python .github/repro-local/drive_sidecar.py rel\sidecar\translator-sidecar\translator-sidecar.exe pdf2docx ocr
