name: PR checks

# 日常改动的自动检查：每个 PR、每次推到 main 都跑。
# 只做「快、确定、不依赖本机环境」的检查——发布构建另见 build-distributions.yml。
# 用 Python 3.11 + constraints-release-py311.txt，和发布构建机装的是同一批依赖，
# 免得「本地 .venv 全绿、构建机才炸」（见 AGENTS.md 第 8 条）。
# Linux 上没有 Office / LibreOffice / ODA，依赖它们的测试会自行跳过。

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.3
      # 扩展模板仓库须与 cli/adapter_template/ 逐字节相同（tests/test_cli_adapter.py 比对）：
      # 改模板时两边一起改，先推模板仓库。
      - uses: actions/checkout@v6.0.3
        with:
          repository: KlaraGraff/XL_Translator-extension-template
          path: .runtime/extension-template
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release-py311.txt
      - name: Install dependencies
        run: |
          python -m pip install --constraint constraints-release-py311.txt --requirement requirements.txt --requirement requirements-test.txt
      - name: Ruff (same targets as quality_gate.ps1)
        run: python -m ruff check config.py settings.py api cli core engines translator_adapter adapters scripts tests
      - name: Pytest
        env:
          TRANSLATOR_TEMPLATE_REPO: .runtime/extension-template
        run: python -m pytest -q -p no:cacheprovider tests

  ui:
    name: UI (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Interface language engine
        run: node ../tests/i18n_engine.test.mjs
      - name: Feedback relay
        run: node ../tests/feedback_relay.test.mjs

  # 界面文字放不下的检查（docs/UI_TEXT_FIT.md）：中英法 × 两种窗口逐页找被截断的名称、伸出框外的文字、
  # 右栏横向滚动；另跑「法文加长 30%」只出报告。全在本机：临时数据目录、样例文件、假模型。
  # 字体和本机检查一致：拉丁字母 Inter、中文文泉驿正黑（scripts/ui_text_fit_fonts.conf）。
  ui-text-fit:
    name: UI text fit (zh / en / fr)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release-py311.txt
      - name: Install Python dependencies
        run: python -m pip install --constraint constraints-release-py311.txt --requirement requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies and Playwright
        working-directory: ui
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Fonts (Inter for Latin text, WenQuanYi Zen Hei for Chinese)
        run: |
          sudo apt-get install -y --no-install-recommends fonts-inter fonts-wqy-zenhei
          sudo cp scripts/ui_text_fit_fonts.conf /etc/fonts/conf.d/56-prefer-inter.conf
          fc-cache -f
          fc-match system-ui
      - name: Check interface text in zh / en / fr
        env:
          PYTHON: python
        run: node scripts/ui_text_fit_check.mjs --out ui-text-fit-report
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-text-fit-report
          path: ui-text-fit-report
          if-no-files-found: ignore

  # 「图纸转换工具」一键安装要从 ODA 官网真下载、在 macOS / Windows 上真解包和转换，
  # 依赖外部网站，不放进每个 PR 的必跑检查：改了 core/oda_component_install.py 时
  # 手动触发本工作流（Run workflow，选对应分支）跑一遍。
  oda-install:
    name: ODA one-click install (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release-py311.txt
      - name: Install dependencies
        run: python -m pip install --constraint constraints-release-py311.txt --requirement requirements.txt
      - name: Download, verify, unpack and convert with ODA File Converter
        run: python scripts/oda_install_smoke.py


  # 「PDF 处理组件」「文字识别组件」一键安装：从 PyPI / conda-forge 真下载、解压、试运行。
  # 依赖外部网站，同样只在手动触发时跑；改了 core/component_download.py、
  # core/pdf_component_install.py、core/ocr_component_install.py、
  # core/ppocr_component_install.py 时跑一遍。
  # Windows 上模拟一台「干净」的电脑：系统目录里没有 VC++ 运行库，数据目录带中文和空格
  # （英文系统的代码页写不出这几个字）。
  component-install:
    name: PDF / OCR one-click install (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release-py311.txt
      - name: Install dependencies
        run: python -m pip install --constraint constraints-release-py311.txt --requirement requirements.txt
      - name: Hide the VC++ runtime from System32
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($item in Get-ChildItem C:\Windows\System32\msvcp140*.dll, C:\Windows\System32\vcruntime140*.dll, C:\Windows\System32\concrt140.dll -ErrorAction SilentlyContinue) {
            takeown /f $item.FullName | Out-Null
            icacls $item.FullName /grant "Administrators:F" | Out-Null
            Rename-Item $item.FullName "$($item.Name).hidden"
          }
          "TRANSLATOR_APP_DATA_DIR=$env:RUNNER_TEMP\用户 张三\Translator" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Download, verify, unpack and run both components
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/component_install_smoke.py


  # 系统代理设成 SOCKS 时（Windows「Internet 选项」里只填 SOCKS、macOS 上 ALL_PROXY=socks5://）
  # 翻译、反馈、组件下载照样能发请求，而且确实经过代理。全在本机 127.0.0.1 上，不依赖外部网站；
  # 要改 Windows 当前用户的代理设置（跑完改回），所以只在手动触发时跑。改了 core/system_proxy.py
  # 或新加了发网络请求的地方时手动触发一遍。
  socks-proxy:
    name: SOCKS system proxy (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release-py311.txt
      - name: Install dependencies
        run: python -m pip install --constraint constraints-release-py311.txt --requirement requirements.txt
      - name: Requests through a SOCKS system proxy
        env:
          PYTHONIOENCODING: utf-8
          TRANSLATOR_APP_DATA_DIR: ${{ runner.temp }}/translator-socks
        run: python scripts/socks_proxy_smoke.py
