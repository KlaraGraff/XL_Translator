name: PR checks

# 日常改动的自动检查：每个 PR、每次推到 main 都跑。
# 只做「快、确定、不依赖本机环境」的检查——发布构建另见 build-distributions.yml。
# 用 Python 3.11 + constraints-release-py311.txt，和发布构建机装的是同一批依赖，
# 免得「本地 .venv 全绿、构建机才炸」（见 AGENTS.md 第 8 条）。
# Linux 上没有 Office / LibreOffice / ODA，依赖它们的测试会自行跳过。

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.3
      # 扩展模板仓库须与 cli/adapter_template/ 逐字节相同（tests/test_cli_adapter.py 比对）：
      # 改模板时两边一起改，先推模板仓库。
      - uses: actions/checkout@v6.0.3
        with:
          repository: KlaraGraff/XL_Translator-extension-template
          path: .runtime/extension-template
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release-py311.txt
      - name: Install dependencies
        run: |
          python -m pip install --constraint constraints-release-py311.txt --requirement requirements.txt --requirement requirements-test.txt
      - name: Ruff (same targets as quality_gate.ps1)
        run: python -m ruff check config.py settings.py api cli core engines translator_adapter adapters scripts tests
      - name: Pytest
        env:
          TRANSLATOR_TEMPLATE_REPO: .runtime/extension-template
        run: python -m pytest -q -p no:cacheprovider tests

  ui:
    name: UI (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Interface language engine
        run: node ../tests/i18n_engine.test.mjs
      - name: Feedback relay
        run: node ../tests/feedback_relay.test.mjs

  # 「图纸转换工具」一键安装要从 ODA 官网真下载、在 macOS / Windows 上真解包和转换，
  # 依赖外部网站，不放进每个 PR 的必跑检查：改了 core/oda_component_install.py 时
  # 手动触发本工作流（Run workflow，选对应分支）跑一遍。
  oda-install:
    name: ODA one-click install (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-release-py311.txt
      - name: Install dependencies
        run: python -m pip install --constraint constraints-release-py311.txt --requirement requirements.txt
      - name: Download, verify, unpack and convert with ODA File Converter
        run: python scripts/oda_install_smoke.py

