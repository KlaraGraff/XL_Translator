[package]
name = "translator"
version = "10.3.0"
description = "Translator desktop shell"
authors = ["OA"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
# `tauri::generate_context!` expands the `plugins` block of tauri.conf.json into
# `serde_json` literals, so the crate must have serde_json in scope by name.
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"

[dev-dependencies]
# `tauri::test::mock_app()`: pins the `cleanup_before_exit()` behaviour that
# `SidecarShutdownHook` relies on (docs/TAURI_UPGRADE_CHECKLIST.md, item 1).
tauri = { version = "2.11.5", features = ["test"] }

# Size-tuned release build: about 60% smaller shell binary (measured 19.1MB → 7.3MB
# on the same source). panic = "abort" is deliberately left out: a panic would then
# skip Drop, and SidecarShutdownHook stops the sidecar from its Drop impl.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
