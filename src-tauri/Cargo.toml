[package]
name = "translator"
version = "9.2.8"
description = "Translator desktop shell"
authors = ["KlaraGraff"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
# `tauri::generate_context!` expands the `plugins` block of tauri.conf.json into
# `serde_json` literals, so the crate must have serde_json in scope by name.
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
